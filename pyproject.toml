[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easyscielopy"
version = "0.1.0"
description = "Python library for accessing and parsing SciELO metadata and articles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "beautifulsoup4",
    "lxml",
]

[project.scripts]
easyscielo = "easyscielo.cli:main"


[project.optional-dependencies]
pandas = [
    "pandas",
]
openalex = [
    "pyalex",
]
review = [
    "rispy",
    "bibtexparser",
    "rapidfuzz",
    "jinja2",
]
screening = [
    "scikit-learn",
]
plots = [
    "matplotlib",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.hatch.build]
include = [
    "src/easyscielo",
]

[tool.hatch.build.targets.wheel]
packages = ["src/easyscielo"]

[tool.pytest.ini_options]
addopts = "-m 'not network'"
markers = [
    "network: marks tests that require network access",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
